<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- el juego ocupa toda la pantalla; en el iPhone, «Agregar a inicio» lo abre sin barras del navegador -->
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Isla Flotante">
  <title>Isla Flotante</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fbf7ec; touch-action: none; -webkit-user-select: none; user-select: none; }
    #lienzo { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #fbf7ec; touch-action: none; }
    #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
             font: italic 18px Georgia, "Times New Roman", serif; color: #6a5a48; }
    #barra { width: 220px; height: 3px; background: #e8dcb8; }
    #barra > div { width: 0; height: 100%; background: #5a4636; transition: width .2s; }
    /* Z4 (decimocuarta ronda): en vertical, la isla se ve detrás (velada) y un teléfono que gira explica qué hacer */
    #girar { display: none; position: fixed; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px;
             font: italic 19px Georgia, serif; color: #4a3c2e; background: rgba(251, 247, 236, 0.95); }
    #girar svg { width: 64px; height: 64px; animation: girar 2.4s ease-in-out infinite; }
    #girar small { font-size: 14px; opacity: .75; }
    #girar button { font: italic 16px Georgia, serif; color: #fbf7ec; background: #3d3226; border: 0; border-radius: 6px; padding: 10px 18px; }
    @keyframes girar { 0%, 25% { transform: rotate(0deg); } 50%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
    @media (orientation: portrait) and (max-width: 700px) { #girar { display: flex; } }
  </style>
</head>
<body>
  <canvas id="lienzo" tabindex="-1"></canvas>
  <div id="carga"><div>La isla se está formando…</div><div id="barra"><div></div></div><div id="version" style="font-size:12px;font-style:normal;opacity:.7"></div></div>
  <div id="girar">
    <svg viewBox="0 0 64 64" fill="none" stroke="#4a3c2e" stroke-width="3"><rect x="20" y="6" width="24" height="52" rx="4"/><line x1="28" y1="51" x2="36" y2="51"/></svg>
    <div>Gira el teléfono:<br>la isla se mira de lado.</div>
    <small>El año queda en pausa hasta que lo gires.</small>
    <button id="pantallaCompleta" type="button">jugar a pantalla completa</button>
  </div>
  <script>
    // Ojo: NO cancelar gesturestart/touchmove en el documento. Se probó (v179) y en el iPhone el juego dejó de recibir el
    // pellizco y el arrastre de dos dedos. touch-action: none (en el CSS) basta para que la página no se mueva.
    // Versión: construir_web.sh reemplaza v636 · 460f8b5 · claude/blissful-almeida-32de9d · 24-10 00:42 al publicar. Safari (y más el ícono de inicio) guarda esta página: si
    // version.txt (pedido sin caché) dice otra cosa, se recarga con una dirección nueva (?v=…) que obliga a bajar la última.
    var VERSION = "v636 · 460f8b5 · claude/blissful-almeida-32de9d · 24-10 00:42";
    document.getElementById("version").textContent = VERSION.indexOf("__") === 0 ? "" : VERSION;
    // El juego (~18 MB) no empieza a bajar hasta saber si hay que recargar: antes se bajaba entero y se botaba al recargar.
    var iniciado = false;
    function iniciar() { if (iniciado) return; iniciado = true; document.body.appendChild(script); }
    setTimeout(iniciar, 2000);   // sin respuesta de version.txt en 2 s: se juega lo que hay
    fetch("version.txt?r=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (v) {
      v = (v || "").trim(); if (!v || VERSION.indexOf("__") === 0 || v === VERSION) { iniciar(); return; }
      var marca = "recargada-" + v;
      try { if (sessionStorage.getItem(marca)) { iniciar(); return; } sessionStorage.setItem(marca, "1"); } catch (e) {}
      iniciado = true;   // se va a recargar: no bajar esta versión
      location.replace(location.pathname + "?v=" + encodeURIComponent(v.split(" ")[0]) + "-" + Date.now());
    }).catch(function () { iniciar(); });
    // Z4: en Android, pantalla completa y apaisado con un toque (en el iPhone no hay bloqueo de orientación: se gira a mano)
    document.getElementById("pantallaCompleta").addEventListener("click", function () {
      var e = document.documentElement, p = e.requestFullscreen ? e.requestFullscreen() : (e.webkitRequestFullscreen ? e.webkitRequestFullscreen() : null);
      Promise.resolve(p).then(function () { if (screen.orientation && screen.orientation.lock) return screen.orientation.lock("landscape"); }).catch(function () {});
    });
    var lienzo = document.querySelector("#lienzo"), carga = document.querySelector("#carga"), barra = document.querySelector("#barra > div");
    var config = {
      dataUrl: "Build/76fdd997881a9bb00ead9502b44cb041.data.unityweb",
      frameworkUrl: "Build/9dc432d887ff35f652570f6530000cac.framework.js.unityweb",
      codeUrl: "Build/d4b54582a6af76ced7cd949ba2ef9cfd.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Isla Flotante",
      productName: "Isla Flotante",
      productVersion: "1.0",
      // la acuarela es un filtro de pantalla completa: en pantallas de alta densidad se limita la resolución (rendimiento)
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
    };
    var script = document.createElement("script");
    script.src = "Build/ec77394706db44fdd781e9896e0108af.loader.js";
    script.onload = function () {
      createUnityInstance(lienzo, config, function (p) { barra.style.width = (100 * p) + "%"; })
        .then(function (u) {
          window.isla = u; carga.remove();
          // A2 (decimoquinta ronda): guardar al salir de la página o al cambiar de app (el autoguardado anual no cubre lo jugado desde la última carta)
          var guardar = function () { try { u.SendMessage("Isla guardado", "Guardar"); } catch (e) {} };
          document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") guardar(); });
          window.addEventListener("pagehide", guardar);
          // A10: en vertical el velo tapa el juego: el año se detiene (y sigue al volver a apaisado)
          var vertical = window.matchMedia("(orientation: portrait) and (max-width: 700px)");
          var avisarVertical = function () { try { u.SendMessage("Isla guardado", "Vertical", vertical.matches ? "1" : "0"); } catch (e) {} };
          if (vertical.addEventListener) vertical.addEventListener("change", avisarVertical); else if (vertical.addListener) vertical.addListener(avisarVertical);
          avisarVertical();
        })   // window.isla: para revisar desde la consola (SendMessage)
        .catch(function (e) { carga.textContent = "No se pudo abrir la isla: " + e; });
    };
  </script>
</body>
</html>
