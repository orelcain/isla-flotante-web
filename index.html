<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- el juego ocupa toda la pantalla; en el iPhone, «Agregar a inicio» lo abre sin barras del navegador -->
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Isla Flotante">
  <title>Isla Flotante</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fbf7ec; touch-action: none; -webkit-user-select: none; user-select: none; }
    #lienzo { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #fbf7ec; }
    #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
             font: italic 18px Georgia, "Times New Roman", serif; color: #6a5a48; }
    #barra { width: 220px; height: 3px; background: #e8dcb8; }
    #barra > div { width: 0; height: 100%; background: #5a4636; transition: width .2s; }
    #girar { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 24px;
             font: italic 18px Georgia, serif; color: #6a5a48; background: #fbf7ec; }
    @media (orientation: portrait) and (max-width: 700px) { #girar { display: flex; } }
  </style>
</head>
<body>
  <canvas id="lienzo" tabindex="-1"></canvas>
  <div id="carga"><div>La isla se está formando…</div><div id="barra"><div></div></div><div id="version" style="font-size:12px;font-style:normal;opacity:.7"></div></div>
  <div id="girar">Gira el teléfono:<br>la isla se mira de lado.</div>
  <script>
    // Ojo: NO cancelar gesturestart/touchmove en el documento. Se probó (v179) y en el iPhone el juego dejó de recibir el
    // pellizco y el arrastre de dos dedos. touch-action: none (en el CSS) basta para que la página no se mueva.
    // Versión: construir_web.sh reemplaza v183 · 7e23a6c · claude/isla-flotante-iphone-tests-ayz353 · 11-10 22:30 al publicar. Safari (y más el ícono de inicio) guarda esta página: si
    // version.txt (pedido sin caché) dice otra cosa, se recarga con una dirección nueva (?v=…) que obliga a bajar la última.
    var VERSION = "v183 · 7e23a6c · claude/isla-flotante-iphone-tests-ayz353 · 11-10 22:30";
    document.getElementById("version").textContent = VERSION.indexOf("__") === 0 ? "" : VERSION;
    fetch("version.txt?r=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (v) {
      v = (v || "").trim(); if (!v || VERSION.indexOf("__") === 0 || v === VERSION) return;
      var marca = "recargada-" + v;
      try { if (sessionStorage.getItem(marca)) return; sessionStorage.setItem(marca, "1"); } catch (e) {}
      location.replace(location.pathname + "?v=" + encodeURIComponent(v.split(" ")[0]) + "-" + Date.now());
    }).catch(function () {});
    var lienzo = document.querySelector("#lienzo"), carga = document.querySelector("#carga"), barra = document.querySelector("#barra > div");
    var config = {
      dataUrl: "Build/da1e081038c1715d30958e25284f0177.data.unityweb",
      frameworkUrl: "Build/57d746a64fead7254152e43521172126.framework.js.unityweb",
      codeUrl: "Build/24d075b4a6db25785159df0fed5a8465.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Isla Flotante",
      productName: "Isla Flotante",
      productVersion: "1.0",
      // la acuarela es un filtro de pantalla completa: en pantallas de alta densidad se limita la resolución (rendimiento)
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
    };
    var script = document.createElement("script");
    script.src = "Build/f0ec5589ff0350a9f2fa5832afa598ca.loader.js";
    script.onload = function () {
      createUnityInstance(lienzo, config, function (p) { barra.style.width = (100 * p) + "%"; })
        .then(function () { carga.remove(); })
        .catch(function (e) { carga.textContent = "No se pudo abrir la isla: " + e; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
